<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BET.PRONO - Connexion</title>
<meta name="theme-color" content="#353839">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1efec;--panel:#fff;--line:#ded8d2;--text:#353839;--mute:#6b6f70;--gain:#0a8f65;--loss:#d1415a;--field:#f6f4f1;--accent:#ff7518;--on-accent:#1c1100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202223;--panel:#353839;--line:#484c4d;--text:#f3efe9;--mute:#aeb2b3;--gain:#19e6a0;--loss:#ff7a8a;--field:#2b2d2e}}
:root[data-theme="dark"]{--bg:#202223;--panel:#353839;--line:#484c4d;--text:#f3efe9;--mute:#aeb2b3;--gain:#19e6a0;--loss:#ff7a8a;--field:#2b2d2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;max-width:380px;width:100%}
h1{margin:0 0 4px;font-size:1.5rem;font-weight:800}
.sub{margin:0 0 20px;color:var(--mute);font-size:.9rem}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--field);border-radius:10px;padding:4px}
.tabs button{flex:1;border:none;background:transparent;color:var(--mute);font:inherit;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
input{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;padding:11px;margin-top:4px}
button.primary:disabled{opacity:.6;cursor:wait}
.err{color:var(--loss);font-size:.88rem;min-height:1.2em;margin:0}
footer{color:var(--mute);font-size:.78rem;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>BET.PRONO</h1>
  <p class="sub">Suivi de bankroll personnel — chacun son compte, chacun sa bankroll.</p>
  <div class="tabs" role="tablist">
    <button type="button" id="tabLogin" aria-pressed="true">Connexion</button>
    <button type="button" id="tabRegister" aria-pressed="false">Créer un compte</button>
  </div>
  <form id="form">
    <label>Identifiant<input id="username" name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_.\-]+"></label>
    <label>Mot de passe<input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" id="submit" type="submit">Se connecter</button>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <div style="flex:1;height:1px;background:var(--line)"></div>
      <span style="color:var(--mute);font-size:.85rem">ou</span>
      <div style="flex:1;height:1px;background:var(--line)"></div>
    </div>
    <button class="primary" id="googleBtn" type="button" style="background:#fff;color:#353839;border-color:#ded8d2;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6m0 0v6"></path></svg>
      Connexion avec Google
    </button>
  </form>
  <footer>Interdit aux mineurs. Jouer comporte des risques : endettement, isolement, dépendance. Besoin d'aide ? 09 74 75 13 13 (appel non surtaxé).</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let mode='login';
function setMode(m){
  mode=m;
  $('tabLogin').setAttribute('aria-pressed',m==='login');
  $('tabRegister').setAttribute('aria-pressed',m==='register');
  $('password').autocomplete=m==='login'?'current-password':'new-password';
  $('submit').textContent=m==='login'?'Se connecter':'Créer mon compte';
  $('err').textContent='';
}
$('tabLogin').onclick=()=>setMode('login');
$('tabRegister').onclick=()=>setMode('register');

fetch('/api/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.href='/app'});

$('googleBtn').addEventListener('click', async ev=>{
  ev.preventDefault();
  try{
    const r=await fetch('/api/auth/google/login');
    const data=await r.json();
    if(data.auth_url)window.location.href=data.auth_url;
  }catch(e){$('err').textContent='Erreur Google OAuth.'}
});

$('form').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const err=$('err'),btn=$('submit');
  err.textContent='';
  const username=$('username').value.trim(),password=$('password').value;
  btn.disabled=true;
  try{
    const r=await fetch(mode==='login'?'/api/login':'/api/register',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({username,password})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=data.error||'Une erreur est survenue.';btn.disabled=false;return}
    location.href='/app';
  }catch(e){err.textContent='Connexion au serveur impossible.';btn.disabled=false}
});

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
</script>
</body>
</html>
