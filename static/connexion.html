<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Œil du Trader — Connexion</title>
<link rel="stylesheet" href="/static/oeil.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-title" content="Œil du Trader">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<script src="/static/oeil.js"></script>
<div class="login-wrap">
  <main class="card login-box">
    <svg class="logo" viewBox="0 0 220 130"><use href="#logo"/></svg>
    <h1>Œil du Trader</h1>
    <p class="note">Tes bots, partout. Lecture seule : aucun ordre ne part d'ici.</p>
    <a class="btn gbtn" id="btnGoogle" href="/auth/google" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#1a1408" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5zm22.5 15c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5zM10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1zM24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Se connecter avec Google</a>
    <form id="dev" hidden>
      <p class="note small">Mode essai local (sans Google)</p>
      <input id="devEmail" type="email" placeholder="ton e-mail" required>
      <button class="btn" type="submit">Entrer</button>
    </form>
    <p class="err" id="err"></p>
  </main>
</div>
<script>
const msgs = {etat: "Session expirée, recommence.", code: "Connexion annulée.", google: "Google ne répond pas, réessaie.",
  jeton: "Vérification Google impossible, réessaie.", email: "E-mail Google non vérifié.",
  refuse: "Cet e-mail n'est pas autorisé sur ce site. Demande à l'administrateur de l'ajouter."};
const e = new URLSearchParams(location.search).get("erreur");
if (e) document.getElementById("err").textContent = msgs[e] || "Erreur de connexion.";
fetch("/auth/info").then(r => r.json()).then(i => {
  document.getElementById("btnGoogle").hidden = !i.google;
  document.getElementById("dev").hidden = !i.dev;
});
document.getElementById("dev").addEventListener("submit", async ev => {
  ev.preventDefault();
  const r = await fetch("/auth/dev", {method: "POST", headers: {"Content-Type": "application/json", "X-Oeil": "1"},
    body: JSON.stringify({email: document.getElementById("devEmail").value})});
  if (r.ok) location.href = "/"; else document.getElementById("err").textContent = "Refusé.";
});
</script>
</body>
</html>
