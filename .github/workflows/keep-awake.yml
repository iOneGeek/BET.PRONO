# Garde le site éveillé : Render (offre gratuite) le met en veille après 15 min sans visite,
# et la première ouverture prend alors 30 à 60 s. Une visite légère toutes les 10 min l'évite.
# La page /login ne touche pas la base de données (Neon garde ses propres heures gratuites).
# GitHub peut décaler les tâches planifiées de quelques minutes aux heures chargées.
name: Garder le site éveillé

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visiter la page de connexion
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bet-prono.onrender.com' }}
        run: curl -fsS -o /dev/null --retry 2 --retry-delay 15 --max-time 90 -w "HTTP %{http_code} en %{time_total}s\n" "$SITE_URL/login"
